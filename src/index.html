<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lighthouse</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      body {
        margin: 0;
        background-color: #030407;
        overflow: hidden;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background: radial-gradient(circle at 50% 46%, #0b1324 0%, #060913 52%, #030407 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        user-select: none;
      }
      .boot-ambient-glow {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 520px;
        height: 520px;
        margin-top: -260px;
        margin-left: -260px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(37, 99, 235, 0.14) 0%, rgba(30, 64, 175, 0.07) 38%, rgba(15, 23, 42, 0.02) 65%, transparent 75%);
        pointer-events: none;
      }
      .boot-card {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .boot-logo-wrap {
        position: relative;
        width: 108px;
        height: 108px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
      }
      .boot-logo-halo {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 170px;
        height: 170px;
        margin-top: -85px;
        margin-left: -85px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.28) 0%, rgba(37, 99, 235, 0.12) 45%, transparent 72%);
        pointer-events: none;
      }
      .boot-logo {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.75))
                drop-shadow(0 0 14px rgba(59, 130, 246, 0.2));
      }
      .boot-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        color: rgba(241, 245, 249, 0.94);
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7), 0 0 20px rgba(59, 130, 246, 0.18);
        margin-bottom: 26px;
        text-transform: uppercase;
      }
      .boot-loader-track {
        width: 96px;
        height: 2px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .boot-loader-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(96, 165, 250, 0.7) 35%,
          rgba(255, 255, 255, 0.95) 55%,
          rgba(96, 165, 250, 0.7) 75%,
          transparent
        );
        border-radius: 999px;
        animation: boot-shimmer 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes boot-shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(260%);
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-ambient-glow"></div>
        <div class="boot-card">
          <div class="boot-logo-wrap">
            <div class="boot-logo-halo"></div>
            <img src="assets/logo.png" alt="Lighthouse" class="boot-logo" width="108" height="108" draggable="false" />
          </div>
          <div class="boot-title">LIGHTHOUSE</div>
          <div class="boot-loader-track">
            <div class="boot-loader-bar"></div>
          </div>
        </div>
      </div>
    </app-root>
  </body>
</html>
