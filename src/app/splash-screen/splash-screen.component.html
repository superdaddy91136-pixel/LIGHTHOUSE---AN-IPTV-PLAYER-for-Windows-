<div class="lighthouse-splash" [class.fading-out]="splashService.fadingOut" aria-hidden="true">
  <div class="splash-card">
    <div class="splash-logo-container">
      <img
        src="assets/logo.png"
        alt="Lighthouse"
        class="splash-logo"
        width="108"
        height="108"
        decoding="sync"
        loading="eager"
        draggable="false" />
    </div>
    <div class="splash-brand-title">LIGHTHOUSE</div>
    <div class="splash-loader-track">
      <div class="splash-loader-indicator"></div>
    </div>
  </div>
</div>
