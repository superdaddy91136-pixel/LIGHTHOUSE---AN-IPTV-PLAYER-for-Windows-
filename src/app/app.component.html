<div class="app-layout">
  <app-splash-screen *ngIf="splashScreen.visible"></app-splash-screen>
  <div *ngIf="appPreferences.isLocked$ | async" class="app-pin-lock-overlay" role="dialog" aria-modal="true" aria-label="Application PIN Lock">
    <form class="app-pin-lock-card" (ngSubmit)="submitUnlockPin()">
      <div class="app-pin-lock-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z" />
        </svg>
      </div>
      <h2 class="app-pin-lock-title">Lighthouse Locked</h2>
      <p class="app-pin-lock-subtitle">Enter your PIN to access your library and channels</p>
      <input
        type="password"
        inputmode="numeric"
        maxlength="12"
        class="app-pin-lock-input"
        placeholder="Enter PIN"
        name="unlockPin"
        [(ngModel)]="unlockPinInput"
        (ngModelChange)="unlockPinError = ''"
        autofocus />
      <p *ngIf="unlockPinError" class="app-pin-lock-error">{{ unlockPinError }}</p>
      <button type="submit" class="app-pin-lock-submit" [disabled]="unlockingPin">
        {{ unlockingPin ? 'Verifying...' : 'Unlock' }}
      </button>
    </form>
  </div>
  <app-ambient-background></app-ambient-background>
  <app-nav-bar *ngIf="showNavBar()"></app-nav-bar>
  <main class="app-main" [class.with-nav]="showNavBar()">
    <router-outlet></router-outlet>
  </main>
</div>
